[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ds41f-gateway"
version = "1.0.0"
description = "Production OpenAI-compatible DGX gateway with durable vision jobs"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "uvicorn==0.51.0",
  "anyio==4.14.2",
  "prometheus-client==0.25.0",
  "tokenizers==0.22.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
ds41f-gateway = "ds41f_gateway:main"

[tool.setuptools]
py-modules = ["ds41f_gateway"]
packages = ["laguna_gateway"]

[tool.setuptools.package-data]
laguna_gateway = ["production-settings.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
